{% extends "admin_base.html" %}
{% block admin_content %}<div class="card"><h2>{% if customer %}Edit{% else %}Add{% endif %} Customer</h2><form method="post"><div class="form-group"><label>Name</label><input name="name" value="{{ customer.name if customer else '' }}" required></div><div class="form-group"><label>Email</label><input type="email" name="email" value="{{ customer.email if customer else '' }}" required></div><div class="form-group"><label>Phone</label><input name="phone" value="{{ customer.phone if customer and customer.phone else '' }}"></div><div class="form-group"><label>Address</label><textarea name="address">{{ customer.address if customer and customer.address else '' }}</textarea></div><button class="btn btn-success">Save</button> <a class="btn btn-secondary" href="{{ url_for('admin_customers') }}">Cancel</a></form></div>{% endblock %}
