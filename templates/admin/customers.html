{% extends "admin_base.html" %}
{% block admin_content %}<div class="card"><h2>Customers</h2><a class="btn btn-success" href="{{ url_for('admin_add_customer') }}">Add Customer</a></div><table class="table"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th></tr>{% for c in customers %}<tr><td>{{ c.id }}</td><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.phone or 'N/A' }}</td><td>{{ c.address or 'N/A' }}</td><td class="actions"><a class="btn btn-warning" href="{{ url_for('admin_edit_customer', customer_id=c.id) }}">Edit</a> <form class="inline" method="post" action="{{ url_for('admin_delete_customer', customer_id=c.id) }}" onsubmit="return confirm('Delete customer?')"><button class="btn btn-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No customers.</td></tr>{% endfor %}</table>{% endblock %}
