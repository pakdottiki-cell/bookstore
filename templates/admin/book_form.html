{% extends "admin_base.html" %}
{% block admin_content %}<div class="card"><h2>{% if book %}Edit{% else %}Add{% endif %} Book</h2><form method="post">
<div class="form-group"><label>Title</label><input name="title" value="{{ book.title if book else '' }}" required></div>
<div class="form-group"><label>Author</label><select name="author_id" required>{% for author in authors %}<option value="{{ author.id }}" {% if book and book.author_id == author.id %}selected{% endif %}>{{ author.name }}</option>{% endfor %}</select></div>
<div class="form-group"><label>Genre</label><input name="genre" value="{{ book.genre if book and book.genre else '' }}"></div>
<div class="form-group"><label>Description</label><textarea name="description">{{ book.description if book and book.description else '' }}</textarea></div>
<div class="form-group"><label>Price</label><input type="number" step="0.01" min="0" name="price" value="{{ book.price if book else '' }}" required></div>
<div class="form-group"><label>Stock</label><input type="number" min="0" name="stock" value="{{ book.stock if book else '' }}" required></div>
<button class="btn btn-success">Save</button> <a class="btn btn-secondary" href="{{ url_for('admin_books') }}">Cancel</a></form></div>{% endblock %}
